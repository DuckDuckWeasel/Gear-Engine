<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080b10">
    <title>Gear Engine</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080b10;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #080b10;
      }

      body {
        display: grid;
        place-items: center;
      }

      #unity-container {
        position: relative;
        width: min(100vw, calc(100vh * 9 / 16));
        height: min(100vh, calc(100vw * 16 / 9));
        max-width: 540px;
        max-height: 960px;
        overflow: hidden;
        background: #080b10;
        box-shadow: 0 24px 80px rgb(0 0 0 / 55%);
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #080b10;
      }

      #loading-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: grid;
        align-items: end;
        isolation: isolate;
        overflow: hidden;
        background: #080b10;
        opacity: 1;
        visibility: visible;
        transition: opacity 420ms ease, visibility 420ms step-end;
      }

      #loading-overlay.is-complete {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #loading-video,
      #loading-fallback {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #loading-video {
        z-index: -2;
        background: #080b10;
        pointer-events: none;
      }

      #loading-video::-webkit-media-controls,
      #loading-video::-webkit-media-controls-enclosure,
      #loading-video::-webkit-media-controls-panel,
      #loading-video::-webkit-media-controls-start-playback-button {
        display: none !important;
        -webkit-appearance: none;
      }

      #loading-fallback {
        z-index: -3;
        background:
          radial-gradient(circle at 50% 35%, rgb(255 197 61 / 22%), transparent 34%),
          linear-gradient(180deg, #171d27 0%, #080b10 72%);
      }

      #loading-overlay::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(180deg, transparent 44%, rgb(3 5 8 / 86%) 100%);
      }

      .loading-panel {
        width: 100%;
        padding: clamp(24px, 6vh, 56px) clamp(22px, 7vw, 40px);
        color: #fff7e8;
        text-shadow: 0 2px 12px rgb(0 0 0 / 70%);
      }

      .loading-eyebrow {
        margin: 0 0 8px;
        color: #ffd15a;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .loading-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
      }

      #loading-status {
        margin: 0;
        font-size: clamp(1rem, 3.8vw, 1.2rem);
        font-weight: 750;
      }

      #loading-percentage {
        min-width: 4ch;
        color: #ffd15a;
        font-variant-numeric: tabular-nums;
        font-weight: 850;
        text-align: right;
      }

      .progress-track {
        height: 8px;
        margin-top: 14px;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 999px;
        background: rgb(3 5 8 / 58%);
      }

      #loading-progress {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f6a91a, #ffdc67);
        box-shadow: 0 0 22px rgb(255 190 48 / 58%);
        transform: scaleX(0);
        transform-origin: left center;
        will-change: transform;
      }

      #loading-detail {
        min-height: 1.25rem;
        margin: 10px 0 0;
        color: rgb(255 247 232 / 74%);
        font-size: 0.78rem;
        line-height: 1.5;
      }

      #loading-version {
        display: block;
        margin-top: 8px;
        color: rgb(255 247 232 / 58%);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-align: right;
        text-transform: uppercase;
      }

      #retry-button {
        display: none;
        min-width: 44px;
        min-height: 44px;
        margin-top: 14px;
        padding: 10px 18px;
        border: 0;
        border-radius: 999px;
        color: #14100a;
        background: #ffd15a;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      #retry-button:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 3px;
      }

      #diagnostics-intro,
      #diagnostics-report,
      #diagnostics-actions {
        display: none;
      }

      #loading-overlay.diagnostics-mode {
        align-items: start;
        overflow-y: auto;
        background: #080b10;
      }

      #loading-overlay.diagnostics-mode #loading-video {
        display: none;
      }

      #loading-overlay.diagnostics-mode::after {
        background: radial-gradient(circle at 50% 0%, #273447 0%, #080b10 68%);
      }

      #loading-overlay.diagnostics-mode .loading-panel {
        width: auto;
        margin: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
        padding: 22px;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 24px;
        background: rgb(11 16 24 / 94%);
        box-shadow: 0 18px 48px rgb(0 0 0 / 48%);
        text-shadow: none;
      }

      #loading-overlay.diagnostics-mode #diagnostics-intro,
      #loading-overlay.diagnostics-mode #diagnostics-report,
      #loading-overlay.diagnostics-mode #diagnostics-actions {
        display: block;
      }

      #diagnostics-intro {
        margin: 10px 0 16px;
        color: rgb(255 247 232 / 78%);
        font-size: 0.9rem;
        line-height: 1.45;
      }

      #diagnostics-report {
        max-height: 58vh;
        margin: 0;
        padding: 14px;
        overflow: auto;
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 14px;
        color: #dbe8f8;
        background: #05080d;
        font: 0.72rem/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #diagnostics-actions {
        margin-top: 16px;
      }

      #diagnostics-open-game {
        display: block;
        min-height: 48px;
        padding: 13px 20px;
        border-radius: 999px;
        color: #14100a;
        background: #ffd15a;
        font-weight: 850;
        text-align: center;
        text-decoration: none;
      }

      #diagnostics-open-game:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 3px;
      }

      #unity-warning {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        z-index: 20;
      }

      .unity-banner {
        padding: 10px 14px;
        color: #ffffff;
        background: #9f2424;
        font-size: 0.85rem;
      }

      @media (max-aspect-ratio: 9 / 16) {
        #unity-container {
          width: 100vw;
          height: 100vh;
          max-width: none;
          max-height: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #loading-overlay { transition: none; }
        #loading-progress { will-change: auto; }
      }
    </style>
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1" aria-label="Tela do jogo Gear Engine"></canvas>
      <section id="loading-overlay" aria-live="polite" aria-busy="true">
        <div id="loading-fallback" aria-hidden="true"></div>
        <video id="loading-video" autoplay muted loop playsinline webkit-playsinline preload="auto"
          disablepictureinpicture disableremoteplayback x-webkit-airplay="deny" tabindex="-1" aria-hidden="true">
          <source src="StreamingAssets/GearEngineLoadingLoop.mp4" type="video/mp4">
        </video>
        <div class="loading-panel">
          <p class="loading-eyebrow">Gear Engine</p>
          <div class="loading-row">
            <p id="loading-status">Preparando a corrida</p>
            <span id="loading-percentage" aria-hidden="true">0%</span>
          </div>
          <div id="loading-meter" class="progress-track" role="progressbar" aria-label="Progresso do carregamento" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="loading-progress"></div>
          </div>
          <p id="loading-detail">Baixando os arquivos do jogo…</p>
          <p id="diagnostics-intro">This page only displays diagnostic data and does not start the game.</p>
          <pre id="diagnostics-report" aria-label="WebGL diagnostic report"></pre>
          <div id="diagnostics-actions">
            <a id="diagnostics-open-game" href="/">Open game</a>
          </div>
          <span id="loading-version" aria-label="Version 0.1">v0.1</span>
          <button id="retry-button" type="button">Tentar novamente</button>
        </div>
      </section>
      <div id="unity-warning"></div>
    </main>
    <noscript>Este jogo precisa do JavaScript para funcionar.</noscript>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var overlay = document.querySelector("#loading-overlay");
      var loadingVideo = document.querySelector("#loading-video");
      var loadingStatus = document.querySelector("#loading-status");
      var loadingDetail = document.querySelector("#loading-detail");
      var diagnosticsReport = document.querySelector("#diagnostics-report");
      var loadingPercentage = document.querySelector("#loading-percentage");
      var loadingProgress = document.querySelector("#loading-progress");
      var loadingMeter = document.querySelector("#loading-meter");
      var retryButton = document.querySelector("#retry-button");
      var displayedProgress = 0;
      var targetProgress = 0;
      var lastProgressAt = performance.now();
      var loadingComplete = false;
      var unityStarted = false;
      var diagnosticsMode = new URLSearchParams(window.location.search).has("diagnostics");
      var diagnosticsStorageKey = "gearEngine.webgl.session.v1";
      var previousDiagnosticSession = readDiagnosticSession();
      var diagnosticSession = {
        sessionId: createDiagnosticSessionId(),
        startedAt: Date.now(),
        updatedAt: Date.now(),
        phase: "document_loaded",
        cleanExit: false,
        runtimeReady: false,
        events: [],
        environment: collectDiagnosticEnvironment()
      };

      function createDiagnosticSessionId() {
        return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
      }

      function readDiagnosticSession() {
        try {
          var serialized = window.localStorage.getItem(diagnosticsStorageKey);
          return serialized ? JSON.parse(serialized) : null;
        } catch (error) {
          console.warn("[GearEngineDiagnostics] Could not read the previous session.", error);
          return null;
        }
      }

      function collectDiagnosticEnvironment() {
        var wasmHeapBytes = null;
        try {
          var module = window.unityInstance && window.unityInstance.Module;
          var heap = module && (module.HEAPU8 || module.HEAP8);
          wasmHeapBytes = heap && heap.buffer ? heap.buffer.byteLength : null;
        } catch (error) {
          wasmHeapBytes = null;
        }
        var jsMemory = performance.memory
          ? {
              usedBytes: performance.memory.usedJSHeapSize,
              totalBytes: performance.memory.totalJSHeapSize,
              limitBytes: performance.memory.jsHeapSizeLimit
            }
          : null;
        return {
          userAgent: navigator.userAgent,
          platform: navigator.platform,
          deviceMemoryGb: navigator.deviceMemory || null,
          hardwareConcurrency: navigator.hardwareConcurrency || null,
          screen: window.screen.width + "x" + window.screen.height,
          viewport: window.innerWidth + "x" + window.innerHeight,
          devicePixelRatio: window.devicePixelRatio || 1,
          wasmHeapBytes: wasmHeapBytes,
          jsMemory: jsMemory
        };
      }

      function persistDiagnosticPhase(phase, details) {
        diagnosticSession.phase = phase;
        diagnosticSession.updatedAt = Date.now();
        diagnosticSession.environment = collectDiagnosticEnvironment();
        diagnosticSession.events.push({
          at: diagnosticSession.updatedAt,
          phase: phase,
          details: details || null
        });
        if (diagnosticSession.events.length > 24) {
          diagnosticSession.events.shift();
        }

        try {
          window.localStorage.setItem(diagnosticsStorageKey, JSON.stringify(diagnosticSession));
        } catch (error) {
          console.warn("[GearEngineDiagnostics] Could not persist the current session.", error);
        }
      }

      function buildDiagnosticReport() {
        return {
          current: diagnosticSession,
          previous: previousDiagnosticSession,
          previousEndedAbruptly: Boolean(
            previousDiagnosticSession &&
            !previousDiagnosticSession.cleanExit &&
            Date.now() - previousDiagnosticSession.updatedAt < 86400000)
        };
      }

      window.gearEngineDiagnostics = {
        getReport: buildDiagnosticReport,
        markPhase: persistDiagnosticPhase
      };

      if (previousDiagnosticSession && !previousDiagnosticSession.cleanExit &&
          Date.now() - previousDiagnosticSession.updatedAt < 86400000) {
        console.warn("[GearEngineDiagnostics] Previous session ended abruptly.", previousDiagnosticSession);
      }

      window.addEventListener("error", function (event) {
        persistDiagnosticPhase("javascript_error", {
          message: event.message,
          source: event.filename,
          line: event.lineno,
          column: event.colno,
          stack: event.error && event.error.stack ? String(event.error.stack) : null
        });
      });
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event.reason;
        persistDiagnosticPhase("unhandled_rejection", {
          message: reason && reason.message ? reason.message : String(reason),
          stack: reason && reason.stack ? String(reason.stack) : null
        });
      });
      window.addEventListener("pagehide", function () {
        diagnosticSession.cleanExit = true;
        persistDiagnosticPhase("page_hidden");
      });
      canvas.addEventListener("webglcontextlost", function (event) {
        persistDiagnosticPhase("webgl_context_lost", { statusMessage: event.statusMessage || null });
      });
      var originalConsoleError = console.error.bind(console);
      console.error = function () {
        var message = Array.prototype.map.call(arguments, function (value) {
          return value instanceof Error ? value.stack || value.message : String(value);
        }).join(" ");
        persistDiagnosticPhase("console_error", { message: message.slice(0, 4000) });
        originalConsoleError.apply(console, arguments);
      };
      window.setInterval(function () {
        diagnosticSession.updatedAt = Date.now();
        diagnosticSession.environment = collectDiagnosticEnvironment();
        try {
          window.localStorage.setItem(diagnosticsStorageKey, JSON.stringify(diagnosticSession));
        } catch (error) {
          console.warn("[GearEngineDiagnostics] Could not persist a heartbeat.", error);
        }
      }, 15000);
      persistDiagnosticPhase("document_loaded");

      loadingVideo.controls = false;
      loadingVideo.defaultMuted = true;
      loadingVideo.muted = true;
      loadingVideo.playsInline = true;
      loadingVideo.disablePictureInPicture = true;
      loadingVideo.disableRemotePlayback = true;

      function unityShowBanner(message, type) {
        var warningBanner = document.querySelector("#unity-warning");
        var banner = document.createElement("div");
        banner.className = "unity-banner";
        banner.textContent = message;
        warningBanner.appendChild(banner);
        if (type !== "error") {
          window.setTimeout(function () { banner.remove(); }, 5000);
        }
      }

      function setLoadingCopy() {
        if (unityStarted) {
          loadingStatus.textContent = "Ligando os motores";
          loadingDetail.textContent = "Finalizando os sistemas e preparando a primeira tela…";
          return;
        }

        if (performance.now() - lastProgressAt > 12000) {
          loadingDetail.textContent = "Ainda estamos preparando tudo — o primeiro acesso pode demorar um pouco mais.";
        } else if (targetProgress >= 0.8) {
          loadingDetail.textContent = "Preparando o jogo para este navegador…";
        } else {
          loadingDetail.textContent = "Baixando os arquivos do jogo…";
        }
      }

      function renderProgress() {
        var distance = targetProgress - displayedProgress;
        if (distance > 0.0005) {
          displayedProgress += Math.max(0.0015, distance * 0.075);
          displayedProgress = Math.min(displayedProgress, targetProgress);
        }

        var percentage = Math.round(displayedProgress * 100);
        loadingProgress.style.transform = "scaleX(" + displayedProgress.toFixed(4) + ")";
        loadingPercentage.textContent = percentage + "%";
        loadingMeter.setAttribute("aria-valuenow", String(percentage));
        if (!loadingComplete) {
          setLoadingCopy();
        }
        window.requestAnimationFrame(renderProgress);
      }

      function reportProgress(progress) {
        var nextProgress = Math.max(targetProgress, Math.min(1, progress));
        if (nextProgress > targetProgress) {
          targetProgress = nextProgress;
          lastProgressAt = performance.now();
        }
      }

      function completeLoading() {
        if (loadingComplete) {
          return;
        }

        loadingComplete = true;
        diagnosticSession.runtimeReady = true;
        persistDiagnosticPhase("unity_runtime_ready");
        targetProgress = 1;
        displayedProgress = 1;
        loadingStatus.textContent = "Tudo pronto";
        loadingDetail.textContent = "";
        loadingPercentage.textContent = "100%";
        loadingProgress.style.transform = "scaleX(1)";
        loadingMeter.setAttribute("aria-valuenow", "100");
        overlay.setAttribute("aria-busy", "false");
        overlay.classList.add("is-complete");
        window.setTimeout(function () { loadingVideo.pause(); }, 450);
      }

      function showLoadingError(message) {
        persistDiagnosticPhase("unity_loading_error", { message: String(message || "Unknown loading error") });
        loadingStatus.textContent = "Não foi possível iniciar o jogo";
        loadingDetail.textContent = String(message || "Verifique sua conexão e tente novamente.");
        retryButton.style.display = "inline-block";
        overlay.setAttribute("aria-busy", "false");
      }

      window.gearEngineLoadingReady = completeLoading;
      retryButton.addEventListener("click", function () { window.location.reload(); });

      if (diagnosticsMode) {
        loadingVideo.pause();
      } else if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        loadingVideo.addEventListener("loadeddata", function () { loadingVideo.pause(); }, { once: true });
      } else {
        loadingVideo.play().catch(function () {
          loadingDetail.textContent = "Baixando os arquivos do jogo…";
        });
      }

      if (!diagnosticsMode) {
        window.requestAnimationFrame(renderProgress);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/b26eff302fdae6b5b38999bd3f07e7df.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/debab18309b17fa5017351a0de94ccf0.data.unityweb",
        frameworkUrl: buildUrl + "/cf42848ce7f926b0e2e4f75e9ebb11fe.framework.js.unityweb",
        codeUrl: buildUrl + "/40d65d24cc7135dde5dbdc8b97fe1903.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DDW",
        productName: "Gear Engine",
        productVersion: "0.1",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        autoSyncPersistentDataPath: true,
        showBanner: unityShowBanner,
      };


      var loaderScript = document.createElement("script");
      loaderScript.src = loaderUrl;
      loaderScript.onload = function () {
        persistDiagnosticPhase("unity_loader_ready");
        createUnityInstance(canvas, config, reportProgress).then(function (unityInstance) {
          unityStarted = true;
          targetProgress = Math.max(targetProgress, 0.98);
          setLoadingCopy();
          window.unityInstance = unityInstance;
          persistDiagnosticPhase("unity_instance_created");
          window.setTimeout(function () {
            if (!overlay.classList.contains("is-complete")) {
              completeLoading();
            }
          }, 30000);
        }).catch(showLoadingError);
      };
      loaderScript.onerror = function () {
        persistDiagnosticPhase("unity_loader_download_failed", { loaderUrl: loaderUrl });
        showLoadingError("The game loader could not be downloaded. Check your connection and try again.");
      };
      if (diagnosticsMode) {
        overlay.classList.add("diagnostics-mode");
        loadingStatus.textContent = "WebGL diagnostics";
        loadingDetail.style.display = "none";
        diagnosticsReport.textContent = JSON.stringify(buildDiagnosticReport(), null, 2);
        loadingPercentage.style.display = "none";
        loadingMeter.style.display = "none";
        document.querySelector("#loading-version").style.display = "none";
        overlay.setAttribute("aria-busy", "false");
      } else {
        document.body.appendChild(loaderScript);
      }
    </script>
  </body>
</html>
